name: Check Upstream Media Releases

# Weekly: if FFmpeg or QuickJS-NG has a newer stable release than the pinned submodule, open (or
# update) an issue with the bump steps. Nothing is built or changed automatically.

on:
  schedule:
    - cron: "17 6 * * 1"   # Mondays 06:17 UTC
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4   # submodules not needed: the pinned commits come from the index
      - name: Compare pinned submodules with upstream
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 media/scripts/check_upstream.py --open-issue
